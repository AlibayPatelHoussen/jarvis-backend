<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f7cff'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EJ%3C/text%3E%3C/svg%3E">
<title>Jarvis</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4; --text: #14161b;
    --muted: #646b78; --border: #dde1e8; --accent: #3d6bff; --accent-text: #ffffff;
    --user: #3d6bff; --user-text: #ffffff; --danger: #d6363f; --ok: #1f9d55;
    --warn-bg: #fff4d6; --warn-text: #6b4e00;
    --radius: 18px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --surface: #151821; --surface-2: #1d212c; --text: #e9ebf0;
      --muted: #8c93a3; --border: #262b37; --accent: #5b82ff; --user: #3d6bff;
      --warn-bg: #3a2f0b; --warn-text: #f3d77a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-weight: 700;
  }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.ko { background: var(--danger); }
  .round-btn {
    width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .round-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .mic {
    width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .mic[aria-pressed="true"] { background: var(--danger); color: #fff; border-color: var(--danger);
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 14px; min-height: 36px;
  }
  .banner {
    display: none; background: var(--warn-bg); color: var(--warn-text);
    padding: 8px 16px; font-size: 14px;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .messages { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h2 { color: var(--text); margin: 0 0 6px; font-size: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 14px;
  }
  .msg {
    max-width: 88%; padding: 10px 14px; border-radius: var(--radius);
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow);
  }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text);
    border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 6px; }
  .msg.bot.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  .msg pre {
    background: var(--surface-2); padding: 10px; border-radius: 10px; overflow-x: auto;
    white-space: pre; font-size: 13px; margin: 6px 0;
  }
  .msg code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  .tool {
    align-self: flex-start; font-size: 13px; color: var(--muted);
    background: var(--surface-2); border-radius: 999px; padding: 4px 12px;
  }
  .confirm {
    align-self: flex-start; max-width: 88%; background: var(--surface);
    border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px;
  }
  .confirm code { display: block; margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .confirm .actions { display: flex; gap: 8px; }
  .btn { border: 0; border-radius: 999px; padding: 8px 16px; min-height: 40px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .notice { align-self: center; font-size: 13px; color: var(--muted); }
  .reminder {
    align-self: center; background: var(--warn-bg); color: var(--warn-text);
    border-radius: var(--radius); padding: 10px 16px; font-weight: 600;
  }
  footer {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--border);
  }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 160px; min-height: 44px; padding: 11px 14px;
    border-radius: 22px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font: inherit; outline: none;
  }
  textarea:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .send {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent);
    color: #fff; font-size: 20px; flex: none;
  }
  .send:disabled { opacity: .45; }
  #login {
    position: fixed; inset: 0; background: var(--bg); display: none;
    align-items: center; justify-content: center; padding: 16px;
  }
  #login .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; padding: 24px; box-shadow: var(--shadow);
  }
  #login h1 { margin: 12px 0 4px; font-size: 22px; }
  #login p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  #login input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font: inherit; margin-bottom: 12px;
  }
  #login .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #login .btn { width: 100%; }
  @media (prefers-reduced-motion: reduce) {
    .msg.bot.typing::after, .mic[aria-pressed="true"] { animation: none; }
  }
  @media (max-width: 360px) { header { gap: 6px; } .round-btn { width: 36px; height: 36px; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">J</div>
  <div class="title">
    <b>Jarvis</b>
    <span class="status"><span class="dot" id="dot"></span><span id="status">Connexion…</span></span>
  </div>
  <button class="round-btn" id="notify" type="button" aria-pressed="false"
          aria-label="Notifications sur cet appareil" title="Notifications sur cet appareil"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  <button class="round-btn" id="speak" type="button" aria-pressed="false"
          aria-label="Lire les réponses à voix haute" title="Lire les réponses à voix haute"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
  <button class="round-btn" id="clear" type="button" aria-label="Nouvelle conversation"
          title="Nouvelle conversation"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="round-btn" id="logout" type="button" aria-label="Se déconnecter"
          title="Se déconnecter"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
</header>
<div class="banner" id="banner" role="status"></div>

<main id="scroller">
  <div class="messages" id="messages" aria-live="polite">
    <div class="empty" id="empty">
      <h2>Bonjour !</h2>
      <div>Que puis-je faire pour vous ?</div>
      <div class="chips">
        <button class="chip" type="button">Comment va le serveur ?</button>
        <button class="chip" type="button">Quelles sont mes tâches ?</button>
        <button class="chip" type="button">Rappelle-moi de sortir les poubelles à 20h</button>
        <button class="chip" type="button">Météo</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <button class="mic" id="mic" type="button" aria-label="Parler à Jarvis" title="Parler à Jarvis"
            aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg></button>
    <textarea id="input" rows="1" placeholder="Écrire à Jarvis…" aria-label="Message"
              autocomplete="off" enterkeyhint="send"></textarea>
    <button class="send" id="send" type="submit" aria-label="Envoyer">↑</button>
  </form>
</footer>

<div id="login" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <form class="card" id="login-form">
    <div class="logo" aria-hidden="true">J</div>
    <h1 id="login-title">Jarvis</h1>
    <p>Entrez la clé d'accès (JARVIS_API_KEY du serveur).</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="Clé d'accès"
           aria-label="Clé d'accès" required>
    <div class="error" id="login-error"></div>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), scroller = $("scroller"), input = $("input"), send = $("send");
  let key = "";
  let busy = false;

  // ── Stockage local de la clé (peut échouer en navigation privée) ──
  // Préférences de cet appareil (lecture à voix haute…)
  const prefs = {
    get(name) { try { return localStorage.getItem("jarvis-" + name); } catch { return null; } },
    set(name, value) { try { localStorage.setItem("jarvis-" + name, value); } catch {} },
  };

  const store = {
    get() { try { return localStorage.getItem("jarvis-key") || ""; } catch { return ""; } },
    set(v) { try { localStorage.setItem("jarvis-key", v); } catch {} },
    clear() { try { localStorage.removeItem("jarvis-key"); } catch {} },
  };

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json",
                 ...(options.headers || {}) },
    });
    if (res.status === 401) { showLogin("Clé d'accès invalide."); throw new Error("401"); }
    return res;
  }

  // ── Affichage ──
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
                                           '"': "&quot;", "'": "&#39;" }[c]));
  }
  function format(text) {
    // Texte échappé, puis blocs de code, code en ligne et gras
    let html = escapeHtml(text);
    html = html.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return html;
  }
  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
  function add(className, text = "", html = false) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = className;
    if (html) el.innerHTML = text; else el.textContent = text;
    messages.appendChild(el);
    scrollDown();
    return el;
  }

  // ── Conversation ──
  async function sendMessage(text, viaVoice = false) {
    if (busy || !text.trim()) return;
    stopSpeaking();
    let finalResponse = "";
    busy = true; send.disabled = true;
    add("msg user", text);
    let bot = null, full = "";
    const botBubble = () => {
      if (!bot) { bot = add("msg bot typing"); }
      return bot;
    };
    botBubble();
    try {
      const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ("Erreur " + res.status));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let index;
        while ((index = buffer.indexOf("\n\n")) >= 0) {
          const raw = buffer.slice(0, index); buffer = buffer.slice(index + 2);
          const kind = (raw.match(/^event: (.*)$/m) || [])[1];
          const data = JSON.parse((raw.match(/^data: (.*)$/m) || [, "{}"])[1]);
          if (kind === "token") {
            full += data.text; botBubble().innerHTML = format(full); scrollDown();
          } else if (kind === "tool") {
            const args = Object.entries(data.arguments || {})
              .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
            if (bot && !full) { bot.remove(); bot = null; }
            add("tool", `⚙ ${data.name}(${args})`);
            if (full) { bot.classList.remove("typing"); bot = null; full = ""; }
          } else if (kind === "confirm") {
            if (bot && !full) { bot.remove(); bot = null; }
            askConfirmation(data);
          } else if (kind === "error") {
            botBubble().textContent = data.message;
          } else if (kind === "done") {
            finalResponse = data.response || "";
          }
        }
      }
    } catch (e) {
      if (e.message !== "401") botBubble().textContent = "Erreur : " + e.message;
    } finally {
      if (bot) {
        bot.classList.remove("typing");
        if (!bot.textContent.trim()) bot.remove();
      }
      busy = false; send.disabled = false;
      if (!viaVoice) input.focus();
      // Réponse lue à voix haute si on a parlé, ou si la lecture est activée
      if (finalResponse && (viaVoice || prefs.get("speak") === "on")) speak(finalResponse);
    }
  }

  function askConfirmation({ id, action }) {
    const card = add("confirm",
      `<div><strong>Jarvis veut exécuter :</strong></div><code>${escapeHtml(action)}</code>
       <div class="actions"><button class="btn primary" type="button">Autoriser</button>
       <button class="btn secondary" type="button">Refuser</button></div>`, true);
    const [yes, no] = card.querySelectorAll("button");
    const answer = async (approved) => {
      yes.disabled = no.disabled = true;
      (approved ? yes : no).textContent = approved ? "Autorisé" : "Refusé";
      try {
        await api("/api/chat/confirm", { method: "POST", body: JSON.stringify({ id, approved }) });
      } catch {}
    };
    yes.onclick = () => answer(true);
    no.onclick = () => answer(false);
    yes.focus();
  }

  // ── Rappels et résultats ──
  const skipNotice = new Set();
  async function pollNotifications() {
    if (!key) return;
    try {
      const res = await api("/api/notifications");
      const { notifications } = await res.json();
      for (const n of notifications) {
        if (n.kind === "reminder") {
          add("reminder", "⏰ Rappel : " + n.message);
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Rappel de Jarvis", { body: n.message });
          }
          continue;
        }
        // Autorisations : déjà affichées par pollApprovals (ou par le clic)
        const ref = (n.message.match(/#\d+/) || [""])[0];
        if (n.message.startsWith("Autorisation demandée") || skipNotice.has(ref)) {
          if (n.message.startsWith("Autorisation demandée")) pollApprovals();
          continue;
        }
        add("msg bot", format(n.message), true);
      }
    } catch {}
  }

  // ── Actions en attente (demandées depuis une autre application) ──
  const shownApprovals = new Set();
  async function pollApprovals() {
    if (!key) return;
    try {
      const { approvals } = await (await api("/api/approvals")).json();
      for (const a of approvals) {
        if (shownApprovals.has(a.id)) continue;
        shownApprovals.add(a.id);
        const from = a.source ? ` (depuis ${escapeHtml(a.source)})` : "";
        const card = add("confirm",
          `<div><strong>Action en attente #${a.id}${from} :</strong></div>
           <code>${escapeHtml(a.action)}</code>
           <div class="actions"><button class="btn primary" type="button">Autoriser</button>
           <button class="btn secondary" type="button">Refuser</button></div>`, true);
        const [yes, no] = card.querySelectorAll("button");
        const decide = async (approved) => {
          yes.disabled = no.disabled = true;
          (approved ? yes : no).textContent = approved ? "Autorisé" : "Refusé";
          try {
            const res = await api(`/api/approvals/${a.id}`,
              { method: "POST", body: JSON.stringify({ approved }) });
            if (res.ok) {
              const { result } = await res.json();
              add("msg bot", format(result), true);
              // Le résultat est déjà affiché : on ignore la notification correspondante
              skipNotice.add(`#${a.id}`);
            } else {
              add("notice", "Demande expirée.");
            }
          } catch {}
        };
        yes.onclick = () => decide(true);
        no.onclick = () => decide(false);
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Jarvis demande une autorisation", { body: a.action });
        }
      }
    } catch {}
  }

  // ── État du serveur ──
  async function refreshHealth() {
    try {
      const health = await (await fetch("/health")).json();
      $("dot").className = "dot " + (health.llm_ready ? "ok" : "ko");
      $("status").textContent = health.model;
      const banner = $("banner");
      banner.style.display = health.warning ? "block" : "none";
      banner.textContent = health.warning
        ? health.warning + " Les commandes simples (tâches, calcul, météo…) restent disponibles."
        : "";
    } catch {
      $("dot").className = "dot ko"; $("status").textContent = "Serveur injoignable";
    }
  }

  // ── Connexion ──
  function showLogin(error = "") {
    $("login").style.display = "flex";
    $("login-error").textContent = error;
    $("key").focus();
  }
  async function login(candidate) {
    key = candidate;
    const res = await fetch("/api/me", { headers: { "Authorization": "Bearer " + key } });
    if (!res.ok) { key = ""; store.clear(); showLogin("Clé d'accès invalide."); return false; }
    store.set(key);
    $("login").style.display = "none";
    await loadHistory();
    pollApprovals();
    refreshPushState();
    input.focus();
    return true;
  }
  async function loadHistory() {
    try {
      const { messages: history } = await (await api("/api/history")).json();
      for (const m of history) {
        if (m.role === "user") add("msg user", m.content);
        else if (m.role === "assistant") add("msg bot", format(m.content), true);
      }
    } catch {}
  }

  // ── Voix : parler à Jarvis (micro) et l'entendre (synthèse vocale) ──
  // Tout se fait dans le navigateur / le téléphone : rien à installer.
  function cleanForSpeech(text) {
    return text.replace(/```[\s\S]*?```/g, " (bloc de code) ")
      .replace(/`([^`]*)`/g, "$1").replace(/\*\*([^*]*)\*\*/g, "$1")
      .replace(/https?:\/\/\S+/g, "lien").replace(/[#*_>]/g, " ").replace(/\s+/g, " ").trim();
  }
  function stopSpeaking() {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    stopSpeaking();
    const utterance = new SpeechSynthesisUtterance(cleanForSpeech(text));
    utterance.lang = "fr-FR";
    const voice = speechSynthesis.getVoices().find((v) => v.lang && v.lang.startsWith("fr"));
    if (voice) utterance.voice = voice;
    speechSynthesis.speak(utterance);
  }
  const speakBtn = $("speak");
  function refreshSpeakButton() {
    speakBtn.setAttribute("aria-pressed", prefs.get("speak") === "on" ? "true" : "false");
  }
  speakBtn.hidden = !("speechSynthesis" in window);
  speakBtn.addEventListener("click", () => {
    const on = prefs.get("speak") !== "on";
    prefs.set("speak", on ? "on" : "off");
    refreshSpeakButton();
    if (!on) stopSpeaking();
    add("notice", on ? "Les réponses seront lues à voix haute." : "Lecture à voix haute coupée.");
  });
  refreshSpeakButton();

  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("mic");
  let recognition = null;
  if (Recognition) mic.hidden = false;
  mic.addEventListener("click", () => {
    if (recognition) { recognition.stop(); return; }
    stopSpeaking();
    recognition = new Recognition();
    recognition.lang = "fr-FR";
    recognition.interimResults = true;
    recognition.continuous = false;
    let finalText = "";
    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const piece = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += piece; else interim += piece;
      }
      input.value = (finalText + interim).trim();
      autosize();
    };
    recognition.onerror = (event) => {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        add("notice", "Micro refusé : autorisez-le dans les réglages du navigateur.");
      }
    };
    recognition.onend = () => {
      recognition = null;
      mic.setAttribute("aria-pressed", "false");
      const text = input.value.trim();
      if (text) { input.value = ""; autosize(); sendMessage(text, true); }
    };
    try {
      recognition.start();
      mic.setAttribute("aria-pressed", "true");
    } catch { recognition = null; }
  });

  // ── Notifications push (même page fermée) ──
  const notifyBtn = $("notify");
  const pushSupported = "serviceWorker" in navigator && "PushManager" in window
                        && "Notification" in window;
  let swRegistration = null;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then((reg) => { swRegistration = reg; refreshPushState(); })
      .catch(() => {});
  }
  function keyToBytes(base64) {
    const padded = (base64 + "=".repeat((4 - base64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    return Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
  }
  async function refreshPushState() {
    if (!swRegistration || !pushSupported) return;
    const sub = await swRegistration.pushManager.getSubscription().catch(() => null);
    notifyBtn.setAttribute("aria-pressed", sub ? "true" : "false");
  }
  notifyBtn.addEventListener("click", async () => {
    if (!pushSupported || !swRegistration) {
      add("notice", "Notifications non disponibles ici. Sur iPhone : Partager → Sur l'écran " +
                    "d'accueil, puis ouvrez Jarvis depuis l'icône.");
      return;
    }
    try {
      const existing = await swRegistration.pushManager.getSubscription();
      if (existing) {
        await api("/api/push/unsubscribe", { method: "POST",
                  body: JSON.stringify({ endpoint: existing.endpoint }) }).catch(() => {});
        await existing.unsubscribe();
        add("notice", "Notifications désactivées sur cet appareil.");
        return refreshPushState();
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        add("notice", "Notifications refusées : autorisez-les dans les réglages.");
        return;
      }
      const { publicKey } = await (await api("/api/push/key")).json();
      if (!publicKey) { add("notice", "Notifications push désactivées sur le serveur."); return; }
      add("notice", "Activation des notifications…");
      // Le service de push du navigateur (Apple, Google, Mozilla) peut ne pas répondre
      const timeout = new Promise((_, reject) => setTimeout(
        () => reject(new Error("le service de notifications du navigateur ne répond pas")), 20000));
      const sub = await Promise.race([swRegistration.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: keyToBytes(publicKey) }), timeout]);
      const res = await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
      await api("/api/push/test", { method: "POST" });
      add("notice", "Notifications activées : rappels et autorisations arriveront ici.");
    } catch (e) {
      add("notice", "Impossible d'activer les notifications : " + (e.message || e));
    }
    refreshPushState();
  });

  // ── Événements ──
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value; input.value = ""; autosize();
    sendMessage(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault(); $("form").requestSubmit();
    }
  });
  function autosize() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
  input.addEventListener("input", autosize);
  document.querySelectorAll(".chip").forEach((chip) =>
    chip.addEventListener("click", () => sendMessage(chip.textContent)));
  $("clear").addEventListener("click", async () => {
    if (busy) return;
    await api("/api/conversation/clear", { method: "POST" }).catch(() => {});
    messages.innerHTML = "";
    add("notice", "Nouvelle conversation.");
  });
  $("logout").addEventListener("click", () => { key = ""; store.clear(); showLogin(); });
  $("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    login($("key").value.trim());
  });

  refreshHealth();
  setInterval(refreshHealth, 60000);
  setInterval(pollNotifications, 20000);
  setInterval(pollApprovals, 10000);
  const saved = store.get();
  if (saved) login(saved); else showLogin();
})();
</script>
</body>
</html>
